[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
via_ir = true
optimizer_runs = 1
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

